# Static deploy of the single-page site. The old Vite/functions build is bypassed.
[build]
  command = "mkdir -p dist && cp index.html dist/index.html"
  publish = "dist"

# Point functions at an empty folder so the legacy LMS functions are not deployed.
[functions]
  directory = "netlify/disabled"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
