<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Access — Windows of Breakdown</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet"><style>
:root{
  --bg:#0A1020; --bg2:#0D1526; --surface:#131D33; --surface2:#1C2947; --line:rgba(167,186,224,.26);
  --ink:#F7F9FE; --ink2:#C8D2E6; --ink3:#98A4BD;
  --teal:#14B8A6; --tealHi:#5EEAD4; --tealSoft:rgba(94,234,212,.16);
  --orange:#F97316; --orangeHi:#FDBA74;
  --violet:#A78BFA; --violetHi:#C4B5FD;
  --amber:#D97706; --amberHi:#FCD34D;
  --lift1:0 2px 6px rgba(0,0,0,.42);
  --lift2:0 10px 26px rgba(0,0,0,.48),0 2px 8px rgba(0,0,0,.4);
  --lift3:0 26px 60px rgba(0,0,0,.55),0 8px 22px rgba(0,0,0,.42);
  --sheen:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.02) 42%,rgba(255,255,255,0) 70%);
  --serif:'Sora',ui-sans-serif,system-ui,'Segoe UI',Arial,sans-serif;
  --sans:'Manrope',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --mono:'Space Grotesk',ui-monospace,'SF Mono',Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
::selection{background:rgba(45,212,191,.28)}
a{color:var(--tealHi);text-decoration:none} button{font-family:inherit;cursor:pointer}
h1,h2,h3,.serif{font-family:var(--serif);font-weight:600}
.wrap{max-width:1200px;margin:0 auto;padding:0 clamp(18px,4vw,48px)}
section{position:relative}

/* progress bar */
#prog{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--teal),var(--violet),var(--orange));width:0;z-index:99;transition:width .1s linear}

/* nav */
#nav{position:fixed;top:3px;left:0;right:0;z-index:60;border-bottom:1px solid transparent;transition:.3s}
#nav.solid{background:rgba(10,16,32,.82);backdrop-filter:blur(18px) saturate(1.3);border-color:var(--line);box-shadow:0 10px 40px rgba(0,0,0,.5)}
#nav .wrap{display:flex;align-items:center;justify-content:space-between;height:82px;gap:20px}
.navBrand{font-family:var(--mono);font-size:.9rem;letter-spacing:.22em;color:var(--ink2);white-space:nowrap}
.navBrand b{color:var(--tealHi);text-shadow:0 0 18px rgba(94,234,212,.6)}
#nav ul{display:flex;gap:8px;list-style:none;padding:5px;border-radius:99px;border:1px solid var(--line);
 background:linear-gradient(180deg,rgba(28,41,71,.78),rgba(19,29,51,.7));backdrop-filter:blur(14px);box-shadow:var(--lift2),inset 0 1px 0 rgba(255,255,255,.08)}
#nav ul a{display:block;color:var(--ink2);font-size:1rem;font-weight:600;letter-spacing:.01em;padding:11px 20px;border-radius:99px;border:1px solid transparent;transition:.22s}
#nav ul a:hover{color:var(--ink);background:rgba(255,255,255,.07)}
#nav ul a.cur{color:#04140F;background:linear-gradient(135deg,#5EEAD4,#14B8A6);box-shadow:0 6px 22px rgba(20,184,166,.5);border-color:rgba(94,234,212,.6)}
#nav ul a b{color:var(--amberHi);font-family:var(--mono);font-weight:600;margin-right:6px}
@media(max-width:1080px){#nav ul a{font-size:.86rem;padding:9px 13px}.navBrand{font-size:.76rem}}
@media(max-width:820px){#nav .wrap{height:66px}#nav ul{overflow-x:auto;max-width:60vw;scrollbar-width:none}#nav ul::-webkit-scrollbar{display:none}}

/* reveal */
.rv{opacity:0;transform:translateY(30px);transition:opacity .9s cubic-bezier(.2,.75,.3,1),transform .9s cubic-bezier(.2,.75,.3,1)}
.rv.on{opacity:1;transform:none}
.rv.d1{transition-delay:.1s}.rv.d2{transition-delay:.2s}.rv.d3{transition-delay:.3s}

/* chapter headers */
.chap{padding:clamp(90px,12vw,150px) 0 0}
.chapNum{font-family:var(--mono);font-size:clamp(.8rem,1.4vw,1rem);letter-spacing:.5em;color:var(--amberHi);display:flex;align-items:center;gap:16px}
.chapNum::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.chapTitle{font-size:clamp(2.5rem,7vw,5.2rem);line-height:1.02;margin:22px 0 10px;letter-spacing:-.01em}
.chapTitle .alt{color:var(--ink3);font-style:italic}
.chapLead{color:var(--ink2);font-size:clamp(1rem,1.5vw,1.2rem);max-width:800px;margin-top:18px}
.chapLead b{color:var(--ink)}

/* hero */
#hero{min-height:100svh;display:flex;align-items:center;overflow:hidden;padding:90px 0 40px}
#helix{position:absolute;inset:0;width:100%;height:100%}
.heroGrad{position:absolute;inset:0;background:
 radial-gradient(46% 56% at 76% 24%,rgba(167,139,250,.34),transparent 66%),
 radial-gradient(52% 58% at 14% 70%,rgba(20,184,166,.30),transparent 62%),
 radial-gradient(40% 44% at 50% 108%,rgba(249,115,22,.20),transparent 70%),
 linear-gradient(180deg,rgba(10,16,32,.05),rgba(10,16,32,.55) 78%,var(--bg))}
.heroInner{position:relative;z-index:2;width:100%}
.eyebrow{font-family:var(--mono);font-size:.74rem;letter-spacing:.34em;color:var(--tealHi);text-transform:uppercase}
#hero h1{font-size:clamp(2.7rem,8vw,6rem);line-height:.98;margin:24px 0 0;letter-spacing:-.015em;text-transform:uppercase;font-weight:700}
#hero h1 .l2{color:var(--orangeHi)}
#hero h1 .l3{font-style:italic;text-transform:none;color:var(--tealHi);font-weight:600}
.heroSub{color:var(--ink2);font-size:clamp(1rem,1.6vw,1.25rem);max-width:640px;margin-top:26px}
.heroSub b{color:var(--ink)}
.heroCta{margin-top:40px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.btn{border-radius:14px;padding:16px 30px;font-size:.95rem;font-weight:700;letter-spacing:.02em;border:1px solid var(--line);color:var(--ink);background:rgba(16,24,48,.6);backdrop-filter:blur(8px);transition:.25s}
.btn:hover{transform:translateY(-2px)}
.btn.primary{background:linear-gradient(135deg,#0F766E,#0D9488);border-color:rgba(45,212,191,.45);box-shadow:0 10px 36px rgba(13,148,136,.4)}

.dragHint{position:absolute;right:clamp(16px,4vw,60px);bottom:26px;z-index:2;font-family:var(--mono);font-size:.68rem;letter-spacing:.2em;color:var(--ink3)}

#saw{width:100%;height:320px;display:block}


/* ===== window slider ===== */
.slider{margin-top:26px;position:relative}
.slTrack{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 4px 22px;scrollbar-width:none}
.slTrack::-webkit-scrollbar{display:none}
.wCard{flex:0 0 min(500px,88vw);scroll-snap-align:start;background:linear-gradient(170deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:22px;padding:30px 32px;position:relative;overflow:hidden;transition:border-color .3s}
.wCard::before{content:attr(data-n);position:absolute;right:14px;top:-26px;font-family:var(--serif);font-size:8rem;line-height:1;color:rgba(251,191,36,.08);font-weight:700}
.wCard .wTag{font-family:var(--mono);font-size:.64rem;letter-spacing:.3em;color:var(--amberHi);text-transform:uppercase}
.wCard h4{font-family:var(--serif);font-size:1.45rem;margin:12px 0 4px;line-height:1.2}
.wCard .wSub{color:var(--ink3);font-size:.85rem;font-style:italic;margin-bottom:16px}
.wCard ul{list-style:none;margin-top:6px}
.wCard li{position:relative;padding-left:20px;margin-bottom:10px;color:var(--ink2);font-size:.9rem}
.wCard li::before{content:"▸";position:absolute;left:0;color:var(--orangeHi)}
.wCard li b{color:var(--ink)}
.wCard .wWhy{margin-top:16px;padding:14px 18px;border-left:3px solid var(--amberHi);background:rgba(180,83,9,.10);border-radius:0 12px 12px 0;font-family:var(--serif);font-size:.98rem;color:var(--ink)}
.wCard .wWhy b{color:var(--amberHi)}
.slNav{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:4px}
.slDots{display:flex;gap:8px}
.slDots i{width:26px;height:4px;border-radius:3px;background:var(--line);transition:.3s;cursor:pointer}
.slDots i.on{background:var(--amberHi)}
.slBtns{display:flex;gap:10px}
.slBtns button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.15rem;transition:.2s}
.slBtns button:hover{background:var(--surface2);transform:translateY(-2px)}

/* locks */
.locks{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:30px}
.lock{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px}
.lock .lNum{font-family:var(--mono);font-size:.7rem;letter-spacing:.24em;color:var(--violetHi)}
.lock h4{font-size:1.05rem;margin:10px 0 8px}
.lock p{color:var(--ink3);font-size:.87rem}

/* threshold + fails */
.thWrap{margin-top:60px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:clamp(18px,3vw,28px)}
.thTop{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;margin-bottom:6px}
.thTop h3{font-size:1.08rem}
.toggle{display:flex;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.toggle button{background:transparent;border:0;color:var(--ink3);padding:11px 18px;font-size:.82rem;transition:.2s}
.toggle button.on{background:rgba(139,92,246,.16);color:var(--violetHi)}
#thres{width:100%;height:310px;display:block}
.thCap{font-size:.84rem;color:var(--ink3);padding:12px 4px 4px;max-width:840px}
.failGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:40px}
.fail{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px;transition:.25s}
.fail:hover{transform:translateY(-4px);border-color:rgba(251,146,60,.4)}
.fail .big{font-family:var(--serif);font-size:2rem;color:var(--orangeHi);line-height:1}
.fail h4{font-size:1rem;margin:12px 0 8px}
.fail p{color:var(--ink3);font-size:.87rem}
.fail p b{color:var(--ink2)}

/* script quote */
.script{margin-top:56px;border:1px solid rgba(45,212,191,.3);background:linear-gradient(140deg,rgba(13,148,136,.12),rgba(5,8,15,.2));border-radius:24px;padding:clamp(26px,4vw,44px);position:relative}
.script small{font-family:var(--mono);font-size:.64rem;letter-spacing:.3em;color:var(--tealHi);text-transform:uppercase}
.script p{font-family:var(--serif);font-style:italic;font-size:clamp(1.05rem,2vw,1.35rem);line-height:1.6;color:var(--ink);margin-top:14px}
.script p b{color:var(--tealHi);font-style:normal}

/* ===== chapter 3 : ingredients ===== */
.ingPanel{margin-top:70px;border:1px solid var(--line);border-radius:26px;overflow:hidden;background:linear-gradient(175deg,var(--surface2),var(--surface) 55%)}
.ingHero{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center;padding:clamp(24px,3.6vw,44px);position:relative}
@media(max-width:880px){.ingHero{grid-template-columns:1fr}}
.ingHero .vis{height:300px;position:relative}
.ingHero canvas{width:100%;height:100%;display:block}
.ingHead .idx{font-family:var(--mono);font-size:.68rem;letter-spacing:.3em;color:var(--ink3)}
.ingHead h3{font-size:clamp(1.9rem,3.6vw,2.8rem);line-height:1.05;margin-top:10px}
.ingHead .role{font-family:var(--mono);font-size:.76rem;letter-spacing:.3em;text-transform:uppercase;margin-top:10px}
.ingHead .adline{margin-top:18px;font-family:var(--serif);font-style:italic;font-size:clamp(1.05rem,1.9vw,1.3rem);color:var(--ink);line-height:1.5;border-left:3px solid;padding-left:18px}
.ingHead .quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.ingHead .quick span{font-size:.74rem;padding:7px 13px;border-radius:99px;border:1px solid var(--line);color:var(--ink2)}
.acc{border-top:1px solid var(--line)}
.accItem{border-bottom:1px solid var(--line)}
.accItem:last-child{border-bottom:0}
.accBtn{width:100%;background:transparent;border:0;color:var(--ink);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px clamp(24px,3.6vw,44px);font-size:1rem;font-weight:600;text-align:left;transition:background .2s}
.accBtn:hover{background:rgba(255,255,255,.025)}
.accBtn .cue{font-family:var(--mono);font-size:1.1rem;color:var(--ink3);transition:transform .3s}
.accItem.open .accBtn .cue{transform:rotate(45deg)}
.accBtn small{font-family:var(--mono);font-size:.64rem;letter-spacing:.22em;color:var(--ink3);display:block;font-weight:400;margin-top:3px}
.accPane{max-height:0;overflow:hidden;transition:max-height .55s cubic-bezier(.25,.8,.3,1)}
.accBody{padding:4px clamp(24px,3.6vw,44px) 30px;color:var(--ink2);font-size:.94rem;max-width:900px}
.accBody h5{color:var(--ink);font-size:.95rem;margin:16px 0 8px}
.accBody ul,.accBody ol{margin-left:20px}
.accBody li{margin-bottom:9px}
.accBody li b,.accBody p b{color:var(--ink)}
.accBody .pull{border-left:3px solid var(--tealHi);padding:14px 20px;background:var(--tealSoft);border-radius:0 12px 12px 0;margin:16px 0;font-family:var(--serif);font-size:1rem;color:var(--ink)}
.accBody p{margin-bottom:10px}

/* speed chart */
.spWrap{margin-top:70px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:clamp(18px,3vw,28px)}
#speed{width:100%;height:320px;display:block}
#hmb{width:100%;height:400px;display:block}
.spCap{font-size:.84rem;color:var(--ink3);padding:12px 4px 2px;max-width:860px}
.spCap b{color:var(--ink2)}

footer{border-top:1px solid var(--line);padding:38px 0 48px;color:var(--ink3);font-size:.79rem}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
footer p{max-width:620px;line-height:1.6}

#tip{position:fixed;z-index:90;pointer-events:none;background:#0E1526;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:.8rem;color:var(--ink);box-shadow:0 10px 30px rgba(0,0,0,.55);opacity:0;transition:opacity .15s;max-width:260px}
#tip b{color:var(--amberHi);display:block;font-size:.7rem;font-family:var(--mono);letter-spacing:.12em;margin-bottom:3px}
#tip.show{opacity:1}

/* ============ 3D WINDOW CORRIDOR ============ */
.corHead{margin-top:80px;text-align:center}
.corHead .k{font-family:var(--mono);font-size:.7rem;letter-spacing:.42em;color:var(--tealHi);text-transform:uppercase}
.corHead h3{font-family:var(--serif);font-size:clamp(2.2rem,5.6vw,4rem);line-height:1.06;margin-top:16px}
.corHead h3 em{font-style:italic;color:var(--amberHi)}
.corHead p{color:var(--ink2);max-width:640px;margin:16px auto 0;font-size:1rem}
.corHead .hint{margin-top:22px;font-family:var(--mono);font-size:.68rem;letter-spacing:.3em;color:var(--ink3);text-transform:uppercase}
.corHead .hint::after{content:"";display:block;width:1px;height:44px;margin:12px auto 0;background:linear-gradient(180deg,var(--amberHi),transparent)}

.corTrack{position:relative}
.corStage{position:sticky;top:0;height:100svh;overflow:hidden;
 background:
  radial-gradient(60% 46% at 50% 108%,rgba(180,83,9,.13),transparent 60%),
  radial-gradient(70% 60% at 50% -10%,rgba(139,92,246,.08),transparent 60%),
  linear-gradient(180deg,#05080F 0%,#070D1A 55%,#04070D 100%)}
.corFloor{position:absolute;left:50%;bottom:0;width:200vw;height:44%;transform:translateX(-50%) perspective(700px) rotateX(68deg);transform-origin:bottom;
 background:
  repeating-linear-gradient(90deg,rgba(148,163,196,.09) 0 1px,transparent 1px 90px),
  repeating-linear-gradient(0deg,rgba(148,163,196,.08) 0 1px,transparent 1px 74px),
  linear-gradient(180deg,transparent,rgba(13,148,136,.05));
 mask-image:linear-gradient(180deg,transparent,#000 30%)}
.corCam{position:absolute;inset:0;perspective:920px;perspective-origin:50% 42%}
.corWin{position:absolute;left:50%;top:44%;width:min(46vw,520px);transform-style:preserve-3d;will-change:transform,opacity,filter}
@media(max-width:880px){.corWin{width:min(82vw,440px);top:38%}}
.winFrame{position:relative;border-radius:200px 200px 14px 14px;padding:14px;
 background:linear-gradient(160deg,#3B4E72,#1B2942 58%,#131D33);
 box-shadow:0 30px 80px rgba(0,0,0,.65), inset 0 2px 3px rgba(255,255,255,.14), inset 0 -3px 8px rgba(0,0,0,.6);
 border:1px solid rgba(148,163,196,.25);transition:box-shadow .5s}
.winFrame::after{content:"";position:absolute;left:-6%;right:-6%;bottom:-20px;height:20px;border-radius:6px;
 background:linear-gradient(180deg,#2A3A57,#0C1424);box-shadow:0 12px 30px rgba(0,0,0,.55);border:1px solid rgba(148,163,196,.2)}
.winGlass{position:relative;border-radius:190px 190px 6px 6px;overflow:hidden;background:#0B1120}
.winGlass img{width:100%;display:block;transform:scale(1.04);filter:brightness(1.08) saturate(1.10);transition:transform 1.2s cubic-bezier(.2,.7,.2,1),filter .8s}
.winGlass::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
 background:
  linear-gradient(90deg,transparent calc(50% - 3px),rgba(19,30,51,.96) calc(50% - 3px) calc(50% + 3px),transparent calc(50% + 3px)),
  linear-gradient(0deg,transparent calc(38% - 3px),rgba(19,30,51,.96) calc(38% - 3px) calc(38% + 3px),transparent calc(38% + 3px));
 opacity:1;transition:opacity .8s}
.winGlass::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
 background:linear-gradient(115deg,rgba(255,255,255,.14) 0%,transparent 28%,transparent 68%,rgba(255,255,255,.05) 100%)}
.corWin.lit .winFrame{border-color:rgba(252,211,77,.5);box-shadow:0 34px 100px rgba(0,0,0,.7),0 0 120px rgba(252,211,77,.42),0 0 44px rgba(252,211,77,.3), inset 0 2px 3px rgba(255,255,255,.26)}
.corWin.lit .winGlass::before{opacity:0}
.corWin.lit .winGlass img{transform:scale(1.0);filter:brightness(1.28) contrast(1.06) saturate(1.18)}
.winPlq{position:absolute;left:50%;bottom:-64px;transform:translateX(-50%);white-space:nowrap;
 font-family:var(--mono);font-size:.66rem;letter-spacing:.34em;color:var(--amberHi);text-transform:uppercase;
 background:rgba(11,17,32,.75);border:1px solid rgba(251,191,36,.35);border-radius:99px;padding:8px 18px;backdrop-filter:blur(6px)}

/* narration card */
.corCard{position:absolute;left:clamp(16px,4vw,64px);bottom:clamp(18px,4vh,44px);z-index:2000;max-width:min(480px,62vw);
 background:linear-gradient(168deg,rgba(28,41,71,.9),rgba(11,17,32,.88));backdrop-filter:blur(18px);border:1px solid var(--line);border-left:3px solid var(--amberHi);box-shadow:var(--lift3);
 border-radius:18px;padding:22px 26px;transition:opacity .45s,transform .45s}
.corCard.swap{opacity:0;transform:translateY(14px)}
.corCard .cTag{font-family:var(--mono);font-size:.62rem;letter-spacing:.3em;color:var(--amberHi);text-transform:uppercase}
.corCard h4{font-family:var(--serif);font-size:clamp(1.15rem,2.2vw,1.6rem);margin:8px 0 2px}
.corCard .cSub{color:var(--ink3);font-size:.8rem;font-style:italic}
.corCard p{color:var(--ink2);font-size:.9rem;margin-top:10px;line-height:1.55}
.corCard p b{color:var(--ink)}
@media(max-width:880px){.corCard{left:12px;right:12px;max-width:none;bottom:12px;padding:16px 18px}}

/* muscle HUD */
.musHud{position:absolute;right:clamp(14px,3vw,50px);top:50%;transform:translateY(-50%);z-index:2000;text-align:center;
 background:linear-gradient(168deg,rgba(28,41,71,.86),rgba(13,21,38,.86));backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:22px;padding:20px 20px 18px;width:238px;box-shadow:var(--lift3)}
.musHud .mTag{font-family:var(--mono);font-size:.6rem;letter-spacing:.26em;color:var(--ink3);text-transform:uppercase}
.musStack{position:relative;width:186px;height:256px;margin:12px auto 0}
.musStack::before{content:"";position:absolute;inset:-10%;background:radial-gradient(50% 50% at 50% 46%,rgba(94,234,212,.16),transparent 70%);pointer-events:none}
.musStack img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:14px;transition:opacity .6s,filter .6s;filter:brightness(1.18) saturate(1.12) drop-shadow(0 10px 24px rgba(0,0,0,.55))}
.musPct{font-family:var(--serif);font-size:2rem;font-weight:700;line-height:1;margin-top:10px;transition:color .5s}
.musCap{font-size:.62rem;color:var(--ink3);letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
